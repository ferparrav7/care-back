name: PR Validation

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Tests & Coverage 🧪
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set environment variables
        run: |
          echo "ENV_STATE=test" >> $GITHUB_ENV
          echo "TEST_DATABASE_URL=postgresql+asyncpg://postgres:password@localhost:5432/test_db" >> $GITHUB_ENV

      - name: Run tests
        run: |
          pytest tests \
            --cov=src \
            --cov-report=xml \
            --junitxml=test-results.xml

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: |
            coverage.xml
            test-results.xml

  sonarless:
    name: Sonarless Analysis 📊
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download test artifacts
        uses: actions/download-artifact@v4
        with:
          name: test-artifacts

      - name: Verify Artifacts
        run: |
          echo "Listing files in the current directory:"
          ls -la
          echo "---"
          echo "Content of coverage.xml:"
          cat coverage.xml || echo "coverage.xml not found"

      - name: Run Sonarless
        uses: gitricko/sonarless@v1.3
        env:
          SONAR_COVERAGE_REPORTPATHS: coverage.xml
        with:
          sonar-source-path: "."
          sonar-project-key: care-back
          sonar-project-name: Care-Back
          sonar-metrics-path: sonar-metrics.json
